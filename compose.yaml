services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sathride
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sathride_local_only}
      POSTGRES_DB: sathride
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sathride_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sathride -d sathride"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sathride_db:
